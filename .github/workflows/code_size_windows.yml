name: Code size on Windows

on:
  workflow_dispatch:
  push:
    branches: [ claude/code-size-windows ]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    steps:
      - name: Checkout TinyUSB
        uses: actions/checkout@v6

      - name: Setup Toolchain
        uses: ./.github/actions/setup_toolchain
        with:
          toolchain: 'arm-gcc-windows-latest'

      - name: Get Dependencies
        uses: ./.github/actions/get_deps
        with:
          arg: '-b stm32f407disco'

      - name: Install membrowse
        run: 'python -m pip install --only-binary :all: membrowse==1.2.12'
        shell: bash

      - name: Build one example as code_size.py does
        run: |
          cmake -B evidence -G Ninja -DBOARD=stm32f407disco -DCMAKE_BUILD_TYPE=MinSizeRel examples
          ninja -C evidence cdc_msc
        shell: bash

      - name: Dump link command and membrowse source paths
        run: |
          mkdir -p evidence-out
          find evidence -name 'cdc_msc.elf' | tee evidence-out/elf.txt
          ninja -C evidence -t commands -s device/cdc_msc/cdc_msc.elf > evidence-out/link-fwd.txt 2>&1 || true
          ninja -C evidence -t commands -s 'device\cdc_msc\cdc_msc.elf' > evidence-out/link-back.txt 2>&1 || true
          tail -c 4000 evidence-out/link-fwd.txt
          python -X utf8 - <<'EOF' > evidence-out/membrowse-paths.txt 2>&1 || true
          import json, os, subprocess, sys
          sys.path.insert(0, 'tools')
          from membrowse_cli import extract_ld_scripts, extract_defsyms, link_command, report_inputs
          elf = os.path.join('evidence', 'device', 'cdc_msc', 'cdc_msc.elf')
          commands = link_command('ninja', 'evidence', elf)
          print('ld scripts:', extract_ld_scripts(commands))
          print('defsyms:', extract_defsyms(commands))
          cmd = ['membrowse', 'report'] + report_inputs(elf, extract_ld_scripts(commands), extract_defsyms(commands)) + ['--json', '--all-symbols']
          print('cmd:', cmd)
          r = subprocess.run(cmd, capture_output=True, text=True, encoding='utf-8', errors='replace')
          print('rc', r.returncode, r.stderr[-2000:])
          if r.returncode == 0:
              data = json.loads(r.stdout)
              files = sorted({f"{s.get('object_file')} | {s.get('source_file')}" for s in data.get('symbols', [])})
              print('source files:', len(files))
              print('\n'.join(files[:80]))
          EOF
          cat evidence-out/membrowse-paths.txt
        shell: bash

      - name: Probe the unchanged CLI (expected to fail)
        continue-on-error: true
        run: python -X utf8 tools/code_size.py report -b stm32f407disco -e device/cdc_msc 2>&1 | tee evidence-out/probe.txt
        shell: bash

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-size-windows-evidence
          path: evidence-out/
