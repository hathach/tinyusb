name: Code size on Windows

on:
  workflow_dispatch:
  pull_request:
    paths: &code_size_paths
      - 'tools/code_size.py'
      - 'tools/membrowse_cli.py'
      - 'tools/build_utils.py'
      - 'test/hil/test/test_code_size*.py'
      - 'test/hil/test/test_membrowse_cli.py'
      - '.github/scripts/code_size_ci.py'
      - '.github/workflows/code_size_windows.yml'
  push:
    branches: [ master, claude/code-size-windows ]
    paths: *code_size_paths

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: '1'

jobs:
  unit-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install pytest
      - run: python -m pytest -q test/hil/test/test_code_size.py test/hil/test/test_code_size_ci.py test/hil/test/test_membrowse_cli.py

  smoke:
    runs-on: windows-latest
    env:
      BOARD: stm32f407disco
      EXAMPLE: device/cdc_msc
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout TinyUSB
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Toolchain
        uses: ./.github/actions/setup_toolchain
        with:
          toolchain: 'arm-gcc-windows-latest'

      - name: Get Dependencies
        uses: ./.github/actions/get_deps
        with:
          arg: '-b stm32f407disco'

      - name: Install membrowse
        run: 'python -m pip install --only-binary :all: membrowse==1.2.12'

      - name: Report
        run: |
          python tools/code_size.py report -b $BOARD -e $EXAMPLE --json
          python - <<'EOF'
          import json
          data = json.load(open('cmake-code-size/stm32f407disco/report_device_cdc_msc.json'))
          files = {f for e in data['elfs'] for f in e['sizes']['files']}
          print(data['status'], sorted(files))
          assert data['status'] == 'complete' and any(f.endswith('usbd.c') for f in files), 'no TinyUSB files'
          EOF

      - name: Diff against a local base
        run: |
          python tools/code_size.py diff -b $BOARD -e $EXAMPLE --base-source local --base-branch HEAD --json
          python - <<'EOF'
          import json
          data = json.load(open('cmake-code-size/stm32f407disco/diff_device_cdc_msc.json'))
          assert data['status'] == 'complete' and data['pairs'], data['status']
          assert all(p['base']['files'] == p['current']['files'] for p in data['pairs']), 'HEAD vs HEAD changed'
          EOF

      - name: Diff against CI snapshots
        run: python tools/code_size.py diff -b $BOARD -e $EXAMPLE --base-source ci --base-branch origin/master
