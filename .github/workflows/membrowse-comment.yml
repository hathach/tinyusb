name: Membrowse Comment

# Posts MemBrowse's memory-change comment on a PR once its Build run (and the
# uploads inside it) has finished. workflow_run so it has the base repo's
# pull-requests: write and secrets for fork PRs too. The action is pinned to the
# same membrowse release the CI installs. The template keeps the comment
# to the changes by file: the default one lists every target, and with ~1000 of
# them the body outgrows a GitHub comment. workflow_dispatch re-posts for a
# commit whose reports are already uploaded.
on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA whose reports to summarize
        required: true
      pr_number:
        description: PR to comment on
        required: true

jobs:
  post-comment:
    runs-on: ubuntu-latest
    # one check-and-post at a time per PR branch: a newer run waits for the older one, then
    # its own freshness check runs and its post lands last (never cancel one mid-post).
    # queue: max keeps every pending job in FIFO order: the default single queue would let a
    # late older Build's job replace the newest one, which then never posts; a superseded
    # job still stops at is-current.
    concurrency:
      group: membrowse-comment-${{ github.event.workflow_run.head_repository.full_name || 'dispatch' }}-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
      cancel-in-progress: false
      queue: max
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled')
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # the whole default branch, as pr_comment.yml: code_size_ci.py imports tools/code_size.py,
      # which imports test/hil/helper; the step below fetches agentrc at the pin for gh_pr_comment.py
      - name: Checkout default branch scripts and the comment template
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The PR from trusted workflow_run metadata (never from build artifacts, which a fork
      # controls) by agentrc's gh_pr_comment.py, then the same freshness gate as pr_comment.yml:
      # a Build that a newer push, run or attempt has superseded must not overwrite the comment
      # with an older report. An API error (exit 2) fails the step, never a silent skip.
      - name: Resolve the PR and skip a superseded run
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          PRS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
            echo "post=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # assignments, so a failed fetch or lookup fails the step; none or several PRs print nothing
          agentrc=$(python3 test/hil/helper/agentrc.py fetch)
          num=$(python3 "$agentrc/skills/hil/scripts/gh_pr_comment.py" pr --repo "$REPO" --head-sha "$HEAD_SHA" \
            --head-branch "$HEAD_BRANCH" --head-repo "$HEAD_REPO" --prs "$PRS_JSON")
          [ -n "$num" ] || { echo "no single open PR for $HEAD_SHA, not commenting"; exit 0; }
          echo "number=$num" >> "$GITHUB_OUTPUT"
          rc=0
          python3 .github/scripts/code_size_ci.py is-current --repo "$REPO" --pr "$num" \
            --run-id "$RUN_ID" --attempt "$ATTEMPT" --head-sha "$HEAD_SHA" || rc=$?
          case $rc in
            0) echo "post=true" >> "$GITHUB_OUTPUT" ;;
            1) ;;
            *) echo "::error::cannot tell whether run $RUN_ID is still the PR's latest (exit $rc): not posting"
               exit 1 ;;
          esac

      - name: Post Membrowse PR comment
        if: steps.current.outputs.post == 'true'
        uses: membrowse/membrowse-action/comment-action@v1.2.17
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          commit: ${{ inputs.commit || github.event.workflow_run.head_sha }}
          pr_number: ${{ steps.current.outputs.number }}
          comment_template: .github/membrowse_pr_message.j2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
