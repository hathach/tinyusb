name: Static Analysis
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'hw/bsp/**'
      - '.PVS-Studio/**'
      - 'tools/pvs_studio.py'
      - 'tools/family_json.py'
      - 'tools/build.py'
      - 'tools/get_deps.py'
      - 'test/pvs/**'
      - '.github/actions/**'
      - '.github/workflows/static_analysis.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'hw/bsp/**'
      - '.PVS-Studio/**'
      - 'tools/pvs_studio.py'
      - 'tools/family_json.py'
      - 'tools/build.py'
      - 'tools/get_deps.py'
      - 'test/pvs/**'
      - '.github/actions/**'
      - '.github/workflows/static_analysis.yml'

permissions:
  actions: read
  contents: read
  security-events: write
#  pull-requests: write
#  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CodeQL:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - 'metro_m4_express'
    steps:
      - name: Checkout TinyUSB
        uses: actions/checkout@v6

      - name: Get Dependencies
        uses: ./.github/actions/get_deps
        with:
          arg: -b${{ matrix.board }}

      - name: Setup Toolchain
        uses: ./.github/actions/setup_toolchain
        with:
          toolchain: 'arm-gcc'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'c-cpp'
          queries: security-and-quality

      - name: Build
        run: |
          mkdir -p build
          cmake examples -B build -G Ninja -DBOARD=${{ matrix.board }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: CodeQL
          upload: false
        id: analyze

      - name: Filter SARIF report
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -hw/mcu/**
            -lib/**
          input: ${{ steps.analyze.outputs.sarif-output }}/cpp.sarif
          output: ${{ steps.analyze.outputs.sarif-output }}/cpp.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.analyze.outputs.sarif-output }}
          category: CodeQL

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeql-${{ matrix.board }}
          path: ${{ steps.analyze.outputs.sarif-output }}

  PVS-Studio-Matrix:
    # Secrets are needed: same-repository PRs, pushes and manual runs only; a fork PR gets no PVS verdict
    if: github.repository_owner == 'hathach' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - name: Checkout TinyUSB
        uses: actions/checkout@v6

      - name: Legs from .PVS-Studio/matrix.json
        id: legs
        run: echo "legs=$(python3 tools/pvs_studio.py list --ci-matrix 12)" >> $GITHUB_OUTPUT

  PVS-Studio:
    needs: PVS-Studio-Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.PVS-Studio-Matrix.outputs.legs) }}
    env:
      TOOLCHAIN: ${{ matrix.leg.toolchain }}
      SHARD: ${{ matrix.leg.shard }}
    steps:
      - name: Checkout TinyUSB
        uses: actions/checkout@v6

      - name: Leg boards
        run: |
          echo "LEG_NAME=${TOOLCHAIN}-${SHARD/\//of}" >> $GITHUB_ENV
          echo "LEG_BOARDS=$(python3 tools/pvs_studio.py list --toolchain "$TOOLCHAIN" --shard "$SHARD" --boards)" >> $GITHUB_ENV

      - name: Get Dependencies
        uses: ./.github/actions/get_deps
        with:
          arg: ${{ env.LEG_BOARDS }}

      - name: Setup Toolchain
        uses: ./.github/actions/setup_toolchain
        with:
          toolchain: ${{ env.TOOLCHAIN }}

      - name: Install PVS-Studio
        env:
          PVS_STUDIO_CREDENTIALS: ${{ secrets.PVS_STUDIO_CREDENTIALS }}
        run: |
          wget -q -O - https://files.pvs-studio.com/etc/pubkey.txt | sudo apt-key add -
          sudo wget -O /etc/apt/sources.list.d/viva64.list https://files.pvs-studio.com/etc/viva64.list
          # refresh only the PVS-Studio index; keep the runner's others
          sudo apt update -o Dir::Etc::sourcelist=sources.list.d/viva64.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt install pvs-studio
          read -r n k <<< "$PVS_STUDIO_CREDENTIALS"
          pvs-studio-analyzer credentials "$n" "$k"
          pvs-studio-analyzer --version

      - name: Analyze
        run: |
          if [ "$TOOLCHAIN" == "esp-idf" ]; then
            # the analyzer binaries are static: run them inside the ESP-IDF image with the license
            docker run --rm -e TOOLCHAIN -e SHARD -v "$PWD:/project" -w /project \
              -v /usr/bin/pvs-studio:/usr/bin/pvs-studio:ro \
              -v /usr/bin/pvs-studio-analyzer:/usr/bin/pvs-studio-analyzer:ro \
              -v /usr/bin/plog-converter:/usr/bin/plog-converter:ro \
              -v "$HOME/.config/PVS-Studio:/root/.config/PVS-Studio:ro" \
              espressif/idf:tinyusb bash -c 'git config --global --add safe.directory /project && python3 tools/pvs_studio.py run --toolchain "$TOOLCHAIN" --shard "$SHARD" --out pvs-out'
          else
            python3 tools/pvs_studio.py run --toolchain "$TOOLCHAIN" --shard "$SHARD" --out pvs-out
          fi

      - name: Upload SARIF
        if: always() && hashFiles('pvs-out/pvs-studio.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pvs-out/pvs-studio.sarif
          category: PVS-Studio-${{ env.LEG_NAME }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pvs-studio-${{ env.LEG_NAME }}
          path: |
            pvs-out/*.result.json
            pvs-out/pvs-studio.sarif
          if-no-files-found: error

  PVS-Studio-Verdict:
    # coverage spans every leg, so the verdict is taken over all of their results
    needs: PVS-Studio
    if: always() && needs.PVS-Studio.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TinyUSB
        uses: actions/checkout@v6

      - name: Download results
        uses: actions/download-artifact@v5
        with:
          pattern: pvs-studio-*
          path: pvs-results

      - name: Verdict
        shell: bash  # -o pipefail: the verdict's exit, not tee's
        run: python3 tools/pvs_studio.py verdict pvs-results/* | tee -a "$GITHUB_STEP_SUMMARY"

  SonarQube:
    # Only run on non-forked PR since secrets token is required
    if: github.repository_owner == 'hathach' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory
    strategy:
      fail-fast: false
      matrix:
        board:
          - 'stm32h743eval'
    steps:
      - name: Checkout TinyUSB
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Get Dependencies
        uses: ./.github/actions/get_deps
        with:
          arg: -b${{ matrix.board }}

      - name: Setup Toolchain
        uses: ./.github/actions/setup_toolchain
        with:
          toolchain: 'arm-gcc'

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v6

      - name: Run Build Wrapper
        run: |
          cmake examples -B build -G Ninja -DBOARD=${{ matrix.board }} -DCMAKE_BUILD_TYPE=MinSizeRel
          build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build build/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Consult https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/scanners/sonarscanner/ for more information and options
          args: >
            --define sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json

  IAR-CStat:
    # Only run on non-forked PR since secrets token is required
    #if: github.repository_owner == 'hathach' && github.event.pull_request.head.repo.fork == false
    if: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - 'b_g474e_dpow1'
    steps:
      - name: Checkout TinyUSB
        uses: actions/checkout@v6

      - name: Get Dependencies
        uses: ./.github/actions/get_deps
        with:
          arg: -b${{ matrix.board }}

      - name: Setup Toolchain
        uses: ./.github/actions/setup_toolchain
        with:
          toolchain: 'arm-iar'

      - name: Install CMake 4.2
        run: |
          # IAR CSTAT requires CMake >= 4.1
          wget -q https://github.com/Kitware/CMake/releases/download/v4.2.0-rc1/cmake-4.2.0-rc1-linux-x86_64.tar.gz
          tar -xzf cmake-4.2.0-rc1-linux-x86_64.tar.gz
          echo "${{ github.workspace }}/cmake-4.2.0-rc1-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build and run IAR C-STAT Analysis
        env:
          IAR_LMS_BEARER_TOKEN: ${{ secrets.IAR_LMS_BEARER_TOKEN }}
        run: |
          # CMake run post build to generate C-STAT SARIF report
          cmake --version
          mkdir -p build
          cmake examples/device/cdc_msc -B build -G Ninja -DBOARD=${{ matrix.board }} -DTOOLCHAIN=iar -DIAR_CSTAT=1 -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build
          # Merge sarif files for codeql upload
          npm i -g @microsoft/sarif-multitool
          npx @microsoft/sarif-multitool merge --merge-runs --output-file iar-cstat-${{ matrix.board }}.sarif build/cstat_sarif/*.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: iar-cstat-${{ matrix.board }}.sarif
          category: IAR-CStat

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: iar-cstat-${{ matrix.board }}
          path: iar-cstat-${{ matrix.board }}.sarif
